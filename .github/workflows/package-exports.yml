name: package-exports
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:skill
      - run: npm test
      - name: Package exports and source backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd skills && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-skill.zip" slicecheck)
          (cd kits/chatgpt && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-chatgpt-kit.zip" .)
          (cd kits/copilot && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-copilot-kit.zip" .)
          git archive --format=zip --output=dist/slicecheck-source-backup.zip HEAD
          {
            echo "SliceCheck export manifest"
            echo "Commit: $GITHUB_SHA"
            echo "Created by: GitHub Actions package-exports workflow"
            echo
            echo "slicecheck-skill.zip: self-contained skill folder"
            echo "slicecheck-chatgpt-kit.zip: ChatGPT Custom GPT setup kit"
            echo "slicecheck-copilot-kit.zip: Microsoft 365 Copilot setup kit"
            echo "slicecheck-source-backup.zip: tracked repository snapshot at this commit"
          } > dist/EXPORT-MANIFEST.txt
      - name: Publish persistent exports branch
        shell: bash
        run: |
          set -euo pipefail
          cp -R dist /tmp/slicecheck-exports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan exports
          git rm -rf . || true
          cp /tmp/slicecheck-exports/*.zip .
          cp /tmp/slicecheck-exports/EXPORT-MANIFEST.txt .
          git add *.zip EXPORT-MANIFEST.txt
          git commit -m "Publish SliceCheck exports for ${GITHUB_SHA}"
          git push origin HEAD:exports --force
      - uses: actions/upload-artifact@v4
        with:
          name: slicecheck-exports-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
