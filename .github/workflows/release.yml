name: release
# Push a version tag (for example v1.0.0) to publish a GitHub Release with the
# skill and setup kits attached. Download links in the README point to the
# latest release, so they stay current.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:skill
      - name: Generated files are up to date
        run: git diff --exit-code
      - run: npm test
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd skills && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-skill.zip" slicecheck)
          (cd kits/chatgpt && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-chatgpt-kit.zip" .)
          (cd kits/copilot && zip -qr "$GITHUB_WORKSPACE/dist/slicecheck-copilot-kit.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "SliceCheck $TAG" --notes-file .github/release-notes.md
          fi
      - name: Remove old exports branch
        run: git push origin --delete exports || true
